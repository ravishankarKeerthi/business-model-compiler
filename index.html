 <div class="panel" style="margin-top:12px"><div class="panelhead">Standard Requirement Sheet</div><div class="panelbody"><p class="sub">Requirement ID · Business Area · Process · Problem · Requirement · Rule · AS-IS · TO-BE · Actor · Trigger · Input · Output · Exception · Priority · Scope · Source · Source Reference · Notes</p><button class="btn" onclick="toast('Template downloaded')">Download Template</button></div></div>`;
}
function reports(){
 return `<div class="pagehead"><div><h1>Reports</h1><div class="sub">Operational reports generated from application records.</div></div></div><div class="cards">${["Requirement Coverage","Fit-Gap Register","Functional Spec Register","Developer Handover","Test Coverage","UAT Status","Migration Reconciliation","Training Readiness","Go-Live Readiness","Change Impact"].map(x=>`<div class="stat" style="cursor:pointer" onclick="toast('${x} opened')"><div class="n">→</div><div class="l">${x}</div></div>`).join("")}</div>`;
}

function flowsPage(){
 return `<div class="pagehead"><div><h1>Implementation Flows</h1><div class="sub">Project-manager control of the complete requirements-to-Go-Live lifecycle.</div></div><div class="actions"><button class="btn primary" onclick="toast('Flow checklist created')">+ New Flow</button><button class="btn" onclick="toast('Dependency report opened')">Dependencies</button><button class="btn" onclick="toast('Stage gates opened')">Stage Gates</button></div></div>
 <div class="subnav"><button class="active">Lifecycle</button><button onclick="toast('Stage gates')">Stage Gates</button><button onclick="toast('Dependencies')">Dependencies</button><button onclick="toast('Approvals')">Approvals</button><button onclick="toast('Exceptions')">Exceptions</button><button onclick="toast('Change Flow')">Change Flow</button></div>
 <div class="flowmap"><div class="flowrow">${records.flows.rows.slice(0,9).map((r,i)=>`<div class="flowbox ${i<5?"done":i===5?"current":""}"><b>${r[0]}</b><small>${r[1]}</small><small><strong>Output:</strong> ${r[5]}</small></div>`).join("")}</div></div>
 <div class="dashboard" style="margin-top:12px"><div class="panel"><div class="panelhead">Stage Gate Control</div><div class="panelbody">${[
["Discovery Gate","Requirements captured with evidence","128 / 128","Passed"],
["Analysis Gate","AS-IS + TO-BE approved","116 / 128","In Progress"],
["ERP Gate","Fit-Gap decision completed","86 / 128","In Progress"],
["Solution Gate","Functional design approved","72 / 128","In Progress"],
["Build Gate","Developer tasks completed","57 / 72","In Progress"],
["QA Gate","Critical tests passed","41 / 57","In Progress"],
["UAT Gate","Business sign-off","29 / 41","Pending"],
["Go-Live Gate","Migration + training + blockers","78%","Pending"]
].map(x=>`<div style="padding:9px 0;border-bottom:1px solid #eee;display:grid;grid-template-columns:145px 1fr 75px 80px;gap:8px;align-items:center;font-size:10px"><b>${x[0]}</b><span>${x[1]}</span><b>${x[2]}</b>${tag(x[3])}</div>`).join("")}</div></div>
 <div class="panel" style="margin-top:12px"><div class="panelhead">End-to-End Control Logic</div><div class="panelbody"><table class="o2m"><tr><th>Control</th><th>Rule</th><th>Purpose</th></tr>
<tr><td>Requirement Origin</td><td>Every implementation record must trace to a requirement, approved change, or governance record.</td><td>Prevent orphan work</td></tr>
<tr><td>Stage Gate</td><td>Next stage cannot be approved while mandatory entry criteria are incomplete.</td><td>Prevent premature progression</td></tr>
<tr><td>Change Control</td><td>Post-baseline change requires impact analysis, effort, approval and traceability.</td><td>Protect scope</td></tr>
<tr><td>AI Governance</td><td>AI output is draft until a permitted human role accepts it.</td><td>Protect business accuracy</td></tr>
<tr><td>Go-Live</td><td>Critical requirements, tests, UAT, migration, training and blockers must meet gate criteria.</td><td>Readiness assurance</td></tr>
</table></div></div>
<div class="panel" style="margin-top:12px"><div class="panelhead">Project Manager Control</div><div class="panelbody">${[
["Open dependencies","14","Open dependency register"],
["Pending decisions","2","Decision register"],
["Open risks","7","Risk register"],
["Open defects","5","Defect register"],
["Pending clarifications","12","Clarification register"],
["Scope changes","2","Change requests"],
["Go-Live blockers","3","Readiness checklist"]
].map(x=>`<div class="message"><b>${x[0]} — ${x[1]}</b><p><span class="link" onclick="toast('${x[2]} opened')">${x[2]} →</span></p></div>`).join("")}</div></div></div>`;
}
function doctypePage(){
 return `<div class="pagehead"><div><h1>Doctype Studio</h1><div class="sub">Define the application's business objects, fields, relationships, workflow and permissions — the foundation of the ERP-style product.</div></div><div class="actions"><button class="btn" onclick="toast('Import schema')">Import Schema</button><button class="btn primary" onclick="newRecord('doctype')">+ New Doctype</button></div></div>
 <div class="cards"><div class="stat"><div class="n">38</div><div class="l">DocTypes</div></div><div class="stat"><div class="n">16</div><div class="l">Masters</div></div><div class="stat"><div class="n">17</div><div class="l">Transactions</div></div><div class="stat"><div class="n">5</div><div class="l">System</div></div><div class="stat"><div class="n">100%</div><div class="l">Traceability</div></div></div>
 <div class="doctypedemo"><div><div class="panel"><div class="panelhead">How to create a Doctype</div><div class="panelbody">${[
["1","Define Purpose","What business object is this?"],
["2","Add Fields","Field name, type, mandatory, default, options."],
["3","Define Links","Link to Project, Requirement, Source, ERP Capability, etc."],
["4","Define Workflow","Draft → Review → Approved → Done."],
["5","Define Permissions","Who can read, create, edit, approve, submit?"],
["6","Add Smart Buttons","Expose linked records and counts."],
["7","Add Reports","List, Pivot, Kanban, Activity and custom reports."],
["8","Add Traceability","Every implementation object must have an origin."],
["9","Test & Publish","Validate lifecycle before using the Doctype."],["10","Audit & Traceability","Track source, creator, approver, changes and linked downstream records."],["11","Data Quality","Define mandatory fields, uniqueness, duplicate checks and validations."],["12","Security","Define role, project, record and approval permissions."]
].map(x=>`<div class="dstep"><b>${x[0]}. ${x[1]}</b><small>${x[2]}</small></div>`).join("")}</div></div></div>
 <div><div class="panel"><div class="panelhead">Example: Requirement Doctype</div><div class="panelbody"><table class="o2m"><tr><th>Field</th><th>Type</th><th>Required</th></tr>${[
["requirement_id","Data","Yes"],["project","Link → Project","Yes"],["business_area","Select","Yes"],["process","Link → Business Process","Yes"],["business_problem","Long Text","Yes"],["business_requirement","Long Text","Yes"],["business_rule","Long Text","No"],["as_is","Long Text","Yes"],["to_be","Long Text","Yes"],["source","Link → Requirement Source","Yes"],["priority","Select","Yes"],["scope","Select","Yes"],["status","Workflow State","Yes"]
].map(x=>`<tr><td class="link">${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join("")}</table></div></div>
 <div class="panel" style="margin-top:12px"><div class="panelhead">Smart Buttons</div><div class="panelbody">${smartButtons("Requirement","REQ-SM-001")}</div></div></div></div>
 <div class="panel" style="margin-top:12px"><div class="panelhead">Core Doctype Relationship</div><div class="panelbody"><div class="flowrow">${["Project","Requirement","Fit-Gap","Solution","Functional Spec","Developer Spec","Task","Test","UAT","Go-Live"].map((x,i)=>`<div class="flowbox ${i<4?"done":""}"><b>${x}</b><small>${i===0?"Project root":i===1?"Central business object":"Linked record"}</small></div>`).join("")}</div></div></div>`;
}

function aiPage(mode){
if(mode==="home"){
return `<div class="pagehead"><div><h1>AI Assistant</h1><div class="sub">Context-aware project intelligence grounded in project records and evidence, with human approval at controlled decision points.</div></div><div class="actions"><button class="btn primary" onclick="go('aichat')">Ask the Project</button><button class="btn" onclick="go('aidoc')">Analyse Document</button></div></div>
<div class="cards"><div class="stat"><div class="n">7</div><div class="l">AI Capabilities</div></div><div class="stat"><div class="n">17</div><div class="l">AI Candidates</div></div><div class="stat"><div class="n">12</div><div class="l">Clarifications</div></div><div class="stat"><div class="n">94%</div><div class="l">Evidence Confidence</div></div><div class="stat"><div class="n">0</div><div class="l">Silent Decisions</div></div></div>
<div class="dashboard">
<div class="panel"><div class="panelhead">Requirement Intelligence</div><div class="panelbody">Extract, normalize, deduplicate and complete requirements from any source.<br><button class="btn" onclick="go('aianalysis')">Open</button></div></div>
<div class="panel"><div class="panelhead">Document Intelligence</div><div class="panelbody">Analyse BRD, SOP, PDF, Word, Excel and project evidence with source traceability.<br><button class="btn" onclick="go('aidoc')">Open</button></div></div>
<div class="panel"><div class="panelhead">Meeting Intelligence</div><div class="panelbody">Convert MoM or transcript into decisions, actions, requirements and clarifications.<br><button class="btn" onclick="go('aimeeting')">Open</button></div></div>
<div class="panel"><div class="panelhead">Fit-Gap Assistant</div><div class="panelbody">Compare requirements against the connected ERP capability library.<br><button class="btn" onclick="go('aifitgap')">Open</button></div></div>
<div class="panel"><div class="panelhead">Solution Assistant</div><div class="panelbody">Draft implementation-ready functional and developer specifications.<br><button class="btn" onclick="go('aisolution')">Open</button></div></div>
<div class="panel"><div class="panelhead">Testing Assistant</div><div class="panelbody">Generate positive, negative, exception and UAT scenarios.<br><button class="btn" onclick="go('aitest')">Open</button></div></div>
<div class="panel"><div class="panelhead">Change Impact</div><div class="panelbody">Traverse the traceability graph before approving a change.<br><button class="btn" onclick="go('aiimpact')">Open</button></div></div>
<div class="panel"><div class="panelhead">Project Intelligence</div><div class="panelbody">Identify blockers, missing gates, scope risks and coverage gaps.<br><button class="btn" onclick="go('dashboard')">Open Dashboard</button></div></div>
</div>
<div class="panel" style="margin-top:12px"><div class="panelhead">AI Governance — mandatory controls</div><div class="panelbody"><div class="flow">${["Ground in evidence","Show source","Show confidence","Do not invent facts","Draft before approval","Human Accept / Edit / Reject","Audit AI action","Preserve traceability"].map((x,i)=>`<div class="flowstep"><b>${i+1}. ${x}</b><small>Controlled AI behaviour</small></div>`).join("")}</div></div></div>`;
}
if(mode==="chat") return `<div class="pagehead"><div><h1>Ask the Project</h1><div class="sub">Ask questions against current project records, requirements, evidence and traceability.</div></div></div><div class="panel"><div class="panelhead">Project-aware AI</div><div class="panelbody"><textarea id="aiprompt" rows="4" placeholder="Example: What is missing from REQ-SM-001? What downstream work is affected if its approval rule changes?"></textarea><br><br><button class="btn primary" onclick="runAI()">Analyse Project</button><div id="aianswer" style="margin-top:12px"></div></div></div>`;
const config={
aidoc:["Document Intelligence","Upload or paste BRD, SOP, MoM, Word/PDF/Excel content.","Source → Extract → Normalize → Evidence → Review","Requirement candidates, actors, rules, processes, exceptions"],
aimeeting:["Meeting Intelligence","Process meeting notes or transcript into structured project records.","Transcript / MoM → Decisions → Actions → Requirement Candidates","Requirements, decisions, actions, clarifications"],
aianalysis:["Requirement Analysis","Check completeness, ambiguity, duplicates, conflicts and missing business rules.","Requirement → Completeness → Questions → Review","Clarifications, quality findings, normalized requirement"],
aifitgap:["AI Fit-Gap Assistant","Compare the requirement with the connected ERP capability library.","Requirement + ERP Capability → Compare → Suggest","Fit-Gap decision, rationale, alternatives"],
aisolution:["AI Solution Assistant","Convert approved business decisions into implementation-ready specifications.","Requirement + Fit-Gap → Solution → FS / Dev Spec","Functional specification, developer specification, acceptance criteria"],
aitest:["AI Testing Assistant","Generate test coverage from rules and acceptance criteria.","Acceptance Criteria → Positive / Negative / Exception → UAT","Test cases, UAT scenarios, expected results"],
aiimpact:["Change Impact Assistant","Analyse downstream impact before approving a change.","Change Request → Traceability Graph → Impact","Affected requirements, tasks, tests, UAT, training, Go-Live and effort"]
};
const c=config[mode];
return `<div class="pagehead"><div><h1>${c[0]}</h1><div class="sub">${c[1]}</div></div><div class="actions"><button class="btn" onclick="go('ai')">AI Home</button><button class="btn primary" onclick="toast('AI analysis queued for human review')">Run Analysis</button></div></div>
<div class="panel"><div class="panelhead">Controlled AI Flow</div><div class="panelbody"><div class="flowrow"><div class="flowbox done"><b>Context</b><small>Project records + evidence</small></div><div class="flowbox current"><b>AI Analysis</b><small>${c[2]}</small></div><div class="flowbox gate"><b>Human Review</b><small>Accept / Edit / Reject</small></div><div class="flowbox"><b>Approved Output</b><small>${c[3]}</small></div></div></div></div>
<div class="dashboard" style="margin-top:12px"><div class="panel"><div class="panelhead">AI Control Matrix</div><div class="panelbody"><table class="o2m"><tr><th>Action</th><th>Evidence</th><th>Confidence</th><th>Human Control</th></tr><tr><td>Extract / analyse</td><td>Linked source required</td><td>Shown</td><td>Accept / Edit / Reject</td></tr><tr><td>Suggest decision</td><td>Requirement + ERP capability</td><td>Shown</td><td>Functional approval</td></tr><tr><td>Generate specification</td><td>Approved upstream records</td><td>Shown</td><td>Consultant approval</td></tr></table></div></div>
<div class="panel"><div class="panelhead">Recent AI Work</div><div class="panelbody"><table class="o2m"><tr><th>AI Action</th><th>Context</th><th>Output</th><th>Status</th></tr>${records.ai.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[3]}</td><td>${tag(r[7])}</td></tr>`).join("")}</table></div></div></div>`;
}
function controlPage(key,title,desc){
return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${desc}</div></div><div class="actions"><button class="btn" onclick="toast('Control report opened')">Control Report</button><button class="btn primary" onclick="newRecord('${key}')">+ New</button></div><div></div></div>${renderTable(records[key])}`;
}
function runAI(){
const q=(document.getElementById("aiprompt")||{}).value||"Project completeness";
document.getElementById("aianswer").innerHTML=`<div class="panel" style="background:#faf7fa"><div class="panelhead">AI Draft — Human Review Required</div><div class="panelbody"><b>Question:</b> ${q}<br><br><b>Findings:</b> The assistant inspects linked requirements, evidence, fit-gap decisions, solutions and downstream traceability. It identifies missing information and cites originating records before proposing an answer.<br><br><b>Control:</b> No business fact is committed automatically. Accept, edit or reject the AI draft before it becomes a project record.</div></div>`;
}

function renderList(){
 if(current==="ai")return aiPage("home");
 if(current==="aichat")return aiPage("chat");
 if(current==="aidoc")return aiPage("aidoc");
 if(current==="aimeeting")return aiPage("aimeeting");
 if(current==="aianalysis")return aiPage("aianalysis");
 if(current==="aifitgap")return aiPage("aifitgap");
 if(current==="aisolution")return aiPage("aisolution");
 if(current==="aitest")return aiPage("aitest");
 if(current==="aiimpact")return aiPage("aiimpact");
 if(current==="dependencies")return controlPage("dependencies","Dependencies","Control prerequisite and downstream relationships across the implementation.");
 if(current==="approvals")return controlPage("approvals","Approvals","Central approval register for scope, fit-gap, solution, UAT and Go-Live decisions.");
 if(current==="stagegates")return controlPage("stagegates","Stage Gates","Formal entry and exit controls preventing premature progression.");
 if(current==="flows")return flowsPage();
 if(current==="doctype")return doctypePage();
 let r=records[current];if(!r)return dashboard();
 return `<div class="pagehead"><div><h1>${r.title}</h1><div class="sub">${r.model} · Solar Sheet Manufacturing</div></div><div class="actions"><button class="btn" onclick="toast('Import opened')">Import</button><button class="btn" onclick="toast('Export prepared')">Export</button><button class="btn primary" onclick="newRecord(current)">+ New</button></div></div>
 <div class="viewbar"><input class="search" placeholder="Search..." value="${currentFilter}" oninput="filterRows(this.value)"><button class="dropdown" onclick="openFilters()">☷ Filters</button><button class="dropdown" onclick="openGroupBy()">☷ Group By</button><button class="dropdown" onclick="toggleFavorites()">☆ ${showFavorites?'All Records':'Favorites'}</button><span style="margin-left:auto"></span><button class="viewbtn ${currentView==='list'?'active':''}" onclick="setView('list')">☷ List</button><button class="viewbtn ${currentView==='kanban'?'active':''}" onclick="setView('kanban')">▦ Kanban</button><button class="viewbtn ${currentView==='activity'?'active':''}" onclick="setView('activity')">◷ Activity</button></div>
 <div id="listarea">${currentView==='kanban'?renderKanban(r):currentView==='activity'?renderActivity(r):renderTable(r)}</div>`;
}
function visibleRows(r){
 let rows=r.rows.slice();
 if(currentFilter) rows=rows.filter(row=>row.join(' ').toLowerCase().includes(currentFilter.toLowerCase()));
 if(showFavorites) rows=rows.filter(row=>String(row[0]).endsWith('*'));
 if(r._tempStatus){let idx=r.fields.findIndex(f=>/status/i.test(f)); if(idx>=0) rows=rows.filter(row=>String(row[idx])===r._tempStatus);}
 if(currentGroup){let idx=r.fields.indexOf(currentGroup);if(idx>=0)rows.sort((a,b)=>String(a[idx]).localeCompare(String(b[idx])));}
 return rows;
}
function renderTable(r){let rows=visibleRows(r);return `<div class="tablebox"><table id="maintable"><thead><tr>${r.fields.map(f=>`<th>${f}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr onclick='openRecord("${current}",${JSON.stringify(row).replace(/'/g,"&#39;")})'>${row.map((v,i)=>`<td>${i===0?`<span class="link">${v}</span>`:i===row.length-1?tag(v):v}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${r.fields.length}" style="text-align:center;padding:25px;color:#777">No records match the current view.</td></tr>`}</tbody></table></div>`;}
function renderActivity(r){return `<div class="activitylist">${visibleRows(r).slice(0,12).map((row,i)=>`<div class="activityitem"><div class="avatar">${String(row[0]).slice(0,2)}</div><div><b>${row[0]}</b> · ${row[1]||r.model}<div class="mini">${row[row.length-1]||'Open'} · Project activity ${i+1}</div></div><button class="btn" onclick='openRecord("${current}",${JSON.stringify(row).replace(/'/g,"&#39;")})'>Open</button></div>`).join('')||`<div class="panel"><div class="panelbody">No activity found.</div></div>`}</div>`;}
function openFilters(){let r=records[current];let si=r.fields.findIndex(f=>/status/i.test(f));let vals=si>=0?[...new Set(r.rows.map(x=>x[si]))]:[];document.getElementById('modalbox').innerHTML=`<div class="modalhead"><span>Filters</span><button class="btn" onclick="closeModal()">Close</button></div><div class="formbody"><div class="field"><label>Status</label><select id="filterStatus"><option value="">All statuses</option>${vals.map(v=>`<option>${v}</option>`).join('')}</select></div><div class="field"><label>Text contains</label><input id="filterText" value="${currentFilter}"></div><div class="actions" style="justify-content:flex-end"><button class="btn" onclick="clearFilters()">Clear</button><button class="btn primary" onclick="applyFilters()">Apply</button></div></div>`;document.getElementById('modal').classList.remove('hidden');}
function applyFilters(){currentFilter=document.getElementById('filterText').value;records[current]._tempStatus=document.getElementById('filterStatus').value;closeModal();render();}
function clearFilters(){currentFilter='';records[current]._tempStatus='';closeModal();render();}
function openGroupBy(){let r=records[current];document.getElementById('modalbox').innerHTML=`<div class="modalhead"><span>Group By</span><button class="btn" onclick="closeModal()">Close</button></div><div class="formbody"><div class="field"><label>Group / Sort field</label><select id="groupField"><option value="">None</option>${r.fields.map(f=>`<option ${currentGroup===f?'selected':''}>${f}</option>`).join('')}</select></div><div class="actions" style="justify-content:flex-end"><button class="btn primary" onclick="applyGroup()">Apply</button></div></div>`;document.getElementById('modal').classList.remove('hidden');}
function applyGroup(){currentGroup=document.getElementById('groupField').value;closeModal();render();}
function toggleFavorites(){showFavorites=!showFavorites;render();}

function renderKanban(r){
 let groups=["Draft","In Progress","Approved","Completed"];return `<div class="kanban">${groups.map(g=>`<div class="col"><div class="colhead">${g}</div>${r.rows.filter(x=>String(x[x.length-1]).toLowerCase().includes(g.toLowerCase().split(" ")[0])||g==="Approved"&&/passed|ready|approved|implemented/i.test(x[x.length-1])||g==="Completed"&&/completed|resolved/i.test(x[x.length-1])).slice(0,6).map(x=>`<div class="kcard" onclick='openRecord("${current}",${JSON.stringify(x).replace(/'/g,"&#39;")})'><b>${x[0]}</b><small>${x[1]||""}</small><div>${tag(x[x.length-1])}</div></div>`).join("")}</div>`).join("")}</div>`;
}
function setView(v){currentView=v;render()}
function filterRows(q){currentFilter=q;let area=document.getElementById("listarea");if(area)area.innerHTML=currentView==="activity"?renderActivity(records[current]):currentView==="kanban"?renderKanban(records[current]):renderTable(records[current])}
function render(){buildMenu();document.getElementById("crumb").textContent=current==="dashboard"?"Dashboard":records[current]?.title||"Dashboard";document.getElementById("work").innerHTML=current==="dashboard"?dashboard():current==="intake"?intake():current==="reports"?reports():renderList()}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};render();
</script>
</body>
</html>
